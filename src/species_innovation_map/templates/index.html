<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Species Innovation Map</title>
  <style>
    :root {
      --ink: #17212b;
      --muted: #66727f;
      --paper: #f4f6f8;
      --panel: #ffffff;
      --detail-panel: #fbfcfd;
      --line: #d9dee3;
      --gain: #087f5b;
      --gain-text: #16a36a;
      --gain-soft: #dff5ec;
      --loss: #b42345;
      --loss-text: #df4f64;
      --loss-soft: #fde8ee;
      --accent: #214f72;
      --header: #ffffff;
      --header-ink: #17212b;
      --control: #ffffff;
      --tree-grid: rgba(33,79,114,.025);
      --shadow: 0 8px 24px rgba(32, 45, 54, .07);
    }
    html[data-theme="black"] { --ink: #f1f3f5; --muted: #aeb6bf; --paper: #111315; --panel: #1b1e21; --detail-panel: #202428; --line: #353b40; --gain-soft: #123c30; --loss-soft: #47202b; --accent: #8bb8d5; --header: #0c0d0e; --header-ink: #ffffff; --control: #24282c; --tree-grid: rgba(255,255,255,.035); --shadow: none; }
    html[data-theme="brown"] { --ink: #2d2824; --muted: #756a61; --paper: #eee8df; --panel: #faf7f2; --detail-panel: #f6f1ea; --line: #d7cdc0; --accent: #76553b; --header: #4b392c; --header-ink: #ffffff; --control: #fffdf9; --tree-grid: rgba(91,65,45,.04); }
    html[data-theme="green"] { --ink: #edf4f0; --muted: #a9bbb1; --paper: #102019; --panel: #182b22; --detail-panel: #1d3228; --line: #355044; --gain-soft: #214c3b; --loss-soft: #4b2730; --accent: #93c9ae; --header: #0a1912; --header-ink: #ffffff; --control: #21372c; --tree-grid: rgba(255,255,255,.035); --shadow: none; }
    html[data-theme="blue"] { --ink: #edf3f8; --muted: #aab8c5; --paper: #101c26; --panel: #192a38; --detail-panel: #1e3040; --line: #354c5f; --gain-soft: #174638; --loss-soft: #4a2632; --accent: #91c1df; --header: #0a1721; --header-ink: #ffffff; --control: #213746; --tree-grid: rgba(255,255,255,.035); --shadow: none; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 14px;
      padding: 18px 24px;
      color: var(--header-ink);
      background: var(--header);
      border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0; font: 650 21px/1.1 Georgia, serif; letter-spacing: .01em; }
    .theme-picker { display: flex; align-items: center; gap: 5px; }
    .theme-picker button { width: 18px; height: 18px; padding: 0; border: 1px solid #7f878d; border-radius: 2px; background: var(--swatch); }
    .theme-picker button.active { border-color: var(--swatch); background: var(--swatch); box-shadow: 0 0 0 2px var(--header), 0 0 0 4px var(--accent); }
    .theme-picker button[data-theme-value="white"] { --swatch: #ffffff; }
    .theme-picker button[data-theme-value="black"] { --swatch: #17191b; }
    .theme-picker button[data-theme-value="brown"] { --swatch: #6b4f3b; }
    .theme-picker button[data-theme-value="green"] { --swatch: #173c2b; }
    .theme-picker button[data-theme-value="blue"] { --swatch: #173c57; }
    .summary {
      display: grid;
      grid-template-columns: 130px max-content;
      column-gap: 18px;
      row-gap: 1px;
      padding: 10px 24px 0;
    }
    .card {
      display: contents;
    }
    .card span { color: var(--muted); font-size: 12px; }
    .card strong { color: var(--ink); font-size: 12px; font-weight: 600; text-align: right; }
    .workspace {
      position: relative;
      height: calc(100vh - 145px);
      padding: 14px 20px 20px;
      overflow: hidden;
    }
    .map-panel, .detail-panel {
      min-height: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 9px;
      box-shadow: var(--shadow);
    }
    .map-panel { width: 100%; height: 100%; }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 55px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
    }
    label { color: var(--muted); font-size: 12px; }
    select, button {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--control);
      color: var(--ink);
      padding: 7px 10px;
      font: inherit;
    }
    button { cursor: pointer; }
    button:hover { border-color: var(--accent); color: var(--accent); }
    .legend { margin-left: auto; display: flex; gap: 13px; color: var(--muted); font-size: 12px; }
    .dot { display: inline-block; width: 9px; height: 9px; margin-right: 4px; border-radius: 50%; }
    .dot.gain { background: var(--gain); }
    .dot.loss { background: var(--loss); }
    #treeViewport { height: calc(100% - 55px); overflow: auto; position: relative; cursor: grab; user-select: none; touch-action: none; }
    #treeViewport.dragging { cursor: grabbing; }
    #treeSvg { display: block; background: linear-gradient(90deg, var(--tree-grid) 1px, transparent 1px); background-size: 110px 100%; }
    .branch-hit { stroke: transparent; stroke-width: 14; cursor: pointer; }
    .branch { stroke: #83909a; stroke-width: 1.5; pointer-events: none; transition: stroke .12s, stroke-width .12s; }
    .branch-hit:hover + .branch, .branch.selected { stroke: var(--accent); stroke-width: 4; }
    .connector { stroke: #a6afb5; stroke-width: 1.2; }
    .branch-label { font: 650 11px ui-monospace, SFMono-Regular, Consolas, monospace; cursor: pointer; }
    .gain-value { fill: var(--gain-text); }
    .loss-value { fill: var(--loss-text); }
    .tip-label { font-size: 11px; fill: var(--ink); }
    .taxonomy-tip-label { font-size: 11px; font-weight: 650; fill: var(--accent); }
    .collapsed-label { font-size: 11px; font-weight: 650; fill: var(--accent); cursor: pointer; }
    .collapsed-marker { fill: var(--accent); opacity: .75; cursor: pointer; }
    .node-dot { fill: var(--panel); stroke: #7b8993; stroke-width: 1.2; }
    .phenotype-gain { fill: var(--gain); stroke: white; stroke-width: 2; }
    .phenotype-loss { fill: var(--loss); stroke: white; stroke-width: 2; }
    .detail-panel {
      position: absolute;
      z-index: 10;
      top: 14px;
      right: 20px;
      bottom: 20px;
      width: min(var(--detail-panel-width, 760px), calc(100% - 40px));
      background: var(--detail-panel);
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transform: translateX(calc(100% + 24px)) scale(.97);
      transform-origin: right center;
      transition: transform .2s ease, opacity .16s ease;
      box-shadow: 0 16px 44px rgba(20, 30, 38, .22);
    }
    .workspace.detail-open .detail-panel { opacity: 1; pointer-events: auto; transform: translateX(0) scale(1); }
    .detail-scroll { height: 100%; overflow: auto; }
    .detail-resize-handle {
      position: absolute;
      z-index: 3;
      top: 0;
      bottom: 0;
      left: 0;
      width: 12px;
      border: 0;
      border-radius: 0;
      padding: 0;
      background: transparent;
      cursor: col-resize;
      touch-action: none;
    }
    .detail-resize-handle::after { content: ""; position: absolute; top: 0; bottom: 0; left: 5px; width: 1px; background: transparent; }
    .detail-resize-handle:hover::after, .detail-resize-handle:focus-visible::after, body.detail-resizing .detail-resize-handle::after { background: var(--accent); }
    body.detail-resizing { cursor: col-resize; user-select: none; }
    .detail-head { position: relative; padding: 17px 52px 13px 18px; border-bottom: 1px solid var(--line); }
    .detail-back { display: block; margin: 0 0 8px; border: 0; padding: 0; background: transparent; color: var(--accent); font-size: 11px; line-height: 1.2; }
    .detail-back[hidden] { display: none; }
    .detail-close { position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; padding: 0; border: 0; background: transparent; font-size: 22px; line-height: 1; }
    .detail-head h2 { margin: 0; font: 650 18px/1.2 Georgia, serif; }
    .detail-head p { margin: 5px 0 0; color: var(--muted); font-size: 12px; word-break: break-all; }
    .detail-body { padding: 18px 22px 28px; }
    .empty { color: var(--muted); padding: 24px 4px; }
    .counts { display: flex; gap: 22px; margin-bottom: 14px; color: var(--muted); font-size: 12px; }
    .count { padding: 0; }
    .count strong { margin-left: 5px; color: var(--ink); font-size: 12px; font-weight: 600; }
    .section-title { margin: 18px 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
    .enrichment-toolbar { display: flex; align-items: center; gap: 10px; margin: 8px 0 18px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
    .enrichment-toolbar label { color: var(--muted); font-size: 11px; }
    .enrichment-toolbar select { min-width: 210px; }
    .enrichment-method { margin-left: auto; color: var(--muted); font-size: 10px; }
    .enrichment-section { margin-bottom: 26px; }
    .chart-layout { display: grid; grid-template-columns: minmax(0, 1fr) 74px; gap: 14px; align-items: start; }
    .enrichment-chart { display: grid; gap: 7px; margin: 8px 0 14px; }
    .chart-caption { color: var(--muted); font-size: 10px; margin-bottom: 2px; }
    .chart-row { display: grid; grid-template-columns: minmax(150px, 220px) minmax(180px, 1fr) 42px; align-items: center; gap: 9px; min-height: 25px; }
    .chart-term { color: var(--ink); font-size: 11px; line-height: 1.15; white-space: normal; }
    .chart-track { position: relative; height: 16px; background: transparent; border-left: 1px solid var(--muted); }
    .chart-grid-line { position: absolute; z-index: 0; top: 0; bottom: 0; width: 1px; background: var(--line); }
    .chart-bar { position: relative; z-index: 1; height: 100%; min-width: 2px; }
    .chart-score { color: var(--muted); font: 10px ui-monospace, SFMono-Regular, Consolas, monospace; text-align: right; }
    .chart-axis-row { display: grid; grid-template-columns: minmax(150px, 220px) minmax(180px, 1fr) 42px; align-items: start; gap: 9px; min-height: 25px; }
    .chart-axis { position: relative; height: 24px; border-top: 1px solid var(--muted); }
    .chart-tick { position: absolute; top: -4px; height: 5px; border-left: 1px solid var(--muted); }
    .chart-tick span { position: absolute; top: 7px; transform: translateX(-50%); color: var(--muted); font: 9px ui-monospace, SFMono-Regular, Consolas, monospace; }
    .chart-axis-label { color: var(--muted); font-size: 9px; line-height: 1.2; text-align: right; white-space: pre-line; }
    .fdr-legend { margin-top: 37px; color: var(--muted); font: 9px ui-monospace, SFMono-Regular, Consolas, monospace; }
    .fdr-legend-title { margin-bottom: 5px; color: var(--ink); font: 10px sans-serif; }
    .fdr-step { display: grid; grid-template-columns: 14px 1fr; align-items: center; gap: 5px; height: 25px; }
    .fdr-swatch { width: 14px; height: 25px; }
    .fdr-direction { margin-top: 5px; font: 9px sans-serif; line-height: 1.2; }
    .enrichment-table { table-layout: fixed; }
    .enrichment-table th:nth-child(1) { width: 42%; }
    .enrichment-table th:nth-child(2), .enrichment-table th:nth-child(3) { width: 17%; }
    .enrichment-table th:nth-child(4), .enrichment-table th:nth-child(5) { width: 12%; }
    .enrichment-table th:not(:first-child) { text-align: right; }
    .enrichment-table td { vertical-align: top; overflow-wrap: anywhere; }
    .enrichment-table td:first-child { font-weight: 550; }
    .term-id { display: block; margin-top: 2px; color: var(--muted); font: 10px ui-monospace, SFMono-Regular, Consolas, monospace; }
    .number-cell { white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
    .event-list { display: grid; gap: 5px; }
    .family-button { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; width: 100%; text-align: left; }
    .family-id { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .family-description { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; line-height: 1.3; }
    .function-name { margin-bottom: 5px; font-weight: 650; }
    .function-description { color: var(--muted); font-size: 12px; line-height: 1.45; }
    .annotation-list { margin-top: 8px; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .tag { padding: 1px 6px; border-radius: 10px; font: 700 10px/1.5 sans-serif; text-transform: uppercase; }
    .tag.gain { color: var(--gain); background: var(--gain-soft); }
    .tag.loss { color: var(--loss); background: var(--loss-soft); }
    .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
    .tabs button.active { color: white; border-color: var(--accent); background: var(--accent); }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th { color: var(--muted); text-align: left; font-weight: 600; border-bottom: 1px solid var(--line); padding: 7px 5px; }
    td { border-bottom: 1px solid var(--line); padding: 7px 5px; }
    td button { border: 0; padding: 0; color: var(--accent); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .member-list { display: grid; gap: 0; }
    .member-row { padding: 4px 0; border-bottom: 1px solid var(--line); }
    .member-species { margin: 0 0 1px; color: var(--accent); font-size: 10px; font-weight: 650; line-height: 1.2; word-break: break-all; }
    .genes { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 9px; line-height: 1.25; word-break: break-all; }
    #status { padding: 40px; color: var(--muted); }
    @media (max-width: 950px) {
      .workspace { height: calc(100vh - 145px); }
      .detail-panel { left: 20px; width: auto; }
      .detail-resize-handle { display: none; }
      .chart-layout { grid-template-columns: minmax(0, 1fr) 64px; gap: 8px; }
      .summary { grid-template-columns: 130px max-content; }
    }
  </style>
</head>
<body>
  <header>
    <div class="theme-picker" aria-label="Color theme">
      <button type="button" data-theme-value="white" aria-label="White theme" title="White"></button>
      <button type="button" data-theme-value="black" aria-label="Black theme" title="Black"></button>
      <button type="button" data-theme-value="brown" aria-label="Brown theme" title="Brown"></button>
      <button type="button" data-theme-value="green" aria-label="Green theme" title="Green"></button>
      <button type="button" data-theme-value="blue" aria-label="Blue theme" title="Blue"></button>
    </div>
    <h1>Species Innovation Map</h1>
  </header>
  <section class="summary">
    <div class="card"><span>Species</span><strong id="speciesCount">—</strong></div>
    <div class="card"><span>Gene families</span><strong id="familyCount">—</strong></div>
    <div class="card"><span>Branches</span><strong id="branchCount">—</strong></div>
    <div class="card"><span>Selected phenotype</span><strong id="phenotypeCount">None</strong></div>
  </section>
  <main class="workspace">
    <section class="map-panel">
      <div class="toolbar">
        <label for="phenotypeSelect">Phenotype</label>
        <select id="phenotypeSelect"><option value="">None</option></select>
        <button id="candidateButton" type="button">Candidate genes</button>
        <span id="taxonomyControl" hidden>
          <label for="collapseSelect">Collapse</label>
          <select id="collapseSelect"><option value="">None</option></select>
        </span>
        <div class="legend"><span><i class="dot gain"></i>gain</span><span><i class="dot loss"></i>loss</span></div>
      </div>
      <div id="treeViewport"><div id="status">Loading map…</div><svg id="treeSvg" aria-label="Species tree"></svg></div>
    </section>
    <aside class="detail-panel" aria-hidden="true">
      <div class="detail-resize-handle" id="detailResizeHandle" role="separator" aria-label="Resize detail panel" aria-orientation="vertical" tabindex="0"></div>
      <div class="detail-scroll">
        <div class="detail-head"><button class="detail-close" id="detailClose" type="button" aria-label="Close gene panel">×</button><button class="detail-back" id="detailBack" type="button" hidden>← Back</button><h2 id="detailTitle">Branch details</h2><p id="detailSubtitle">Select a branch in the tree</p></div>
        <div class="detail-body" id="detailBody"><div class="empty">Each branch is annotated with the number of gained and lost gene families.</div></div>
      </div>
    </aside>
  </main>
  <script>
    const SVG = "http://www.w3.org/2000/svg";
    const state = { project: null, branches: new Map(), phenotypeEvents: new Map(), selectedBranch: null, collapseRank: "", expandedGroups: new Set(), annotationSources: [], enrichmentSource: "" };
    const $ = id => document.getElementById(id);
    const number = value => Number(value || 0).toLocaleString();
    const svgEl = (name, attrs = {}) => {
      const node = document.createElementNS(SVG, name);
      for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
      return node;
    };
    async function api(path) {
      const response = await fetch(path);
      if (!response.ok) throw new Error((await response.json()).error || response.statusText);
      return response.json();
    }
    async function start() {
      try {
        const [project, branches, annotationSources] = await Promise.all([api("/api/project"), api("/api/branches"), api("/api/annotation-sources")]);
        state.project = project;
        state.branches = new Map(branches.map(branch => [branch.branch_id, branch]));
        state.annotationSources = annotationSources;
        state.enrichmentSource = annotationSources.some(item => item.source === "KEGG pathway") ? "KEGG pathway" : (annotationSources[0]?.source || "");
        $("speciesCount").textContent = number(project.species_count);
        $("familyCount").textContent = number(project.family_count);
        $("branchCount").textContent = number(branches.length);
        for (const phenotype of project.phenotypes) {
          const option = document.createElement("option"); option.value = phenotype; option.textContent = phenotype;
          $("phenotypeSelect").append(option);
        }
        const rankLabels = {domain: "Domain", phylum: "Phylum", class: "Class", order: "Order", family: "Family", genus: "Genus", species: "Species"};
        const ranks = (project.taxonomy?.ranks || []).filter(rank => rank !== "domain" && rank !== "species");
        for (const rank of ranks) {
          const option = document.createElement("option"); option.value = rank; option.textContent = rankLabels[rank] || rank;
          $("collapseSelect").append(option);
        }
        $("taxonomyControl").hidden = ranks.length === 0;
        $("status").remove();
        renderTree();
      } catch (error) {
        $("status").textContent = "The viewer needs the local API. Run: species-map serve <output-directory>";
        console.error(error);
      }
    }
    function renderTree() {
      const svg = $("treeSvg"); svg.replaceChildren();
      const nodes = new Map(state.project.nodes.map(node => [node.id, {...node}]));
      const root = [...nodes.values()].find(node => !node.parent_id);
      const taxonomy = state.project.taxonomy?.species || {};
      const rank = state.collapseRank;
      function summarize(node) {
        const children = node.children.map(id => nodes.get(id));
        if (!children.length) {
          node.leafCount = 1;
          node.rankValue = rank ? (taxonomy[node.label]?.[rank] || "") : "";
          return;
        }
        children.forEach(summarize);
        node.leafCount = children.reduce((sum, child) => sum + child.leafCount, 0);
        const values = new Set(children.map(child => child.rankValue));
        node.rankValue = values.size === 1 && !values.has("") ? [...values][0] : "";
        node.collapsed = Boolean(
          rank && node.parent_id && node.rankValue && node.leafCount > 1 &&
          !state.expandedGroups.has(`${rank}:${node.id}`)
        );
      }
      summarize(root);
      const visibleNodes = [];
      function collect(node) {
        visibleNodes.push(node);
        if (!node.collapsed) node.children.map(id => nodes.get(id)).forEach(collect);
      }
      collect(root);
      const visibleIds = new Set(visibleNodes.map(node => node.id));
      let leafIndex = 0;
      const spacing = 25;
      function position(node) {
        const children = node.collapsed ? [] : node.children.map(id => nodes.get(id));
        children.forEach(position);
        node.x = 35 + node.depth * 110;
        node.y = children.length ? children.reduce((sum, child) => sum + child.y, 0) / children.length : 24 + leafIndex++ * spacing;
      }
      position(root);
      const maxDepth = Math.max(...visibleNodes.map(node => node.depth));
      svg.setAttribute("width", Math.max(900, 110 * maxDepth + 440));
      svg.setAttribute("height", Math.max(500, leafIndex * spacing + 40));
      for (const node of visibleNodes) {
        const children = node.collapsed ? [] : node.children.map(id => nodes.get(id)).filter(child => visibleIds.has(child.id));
        if (children.length > 1) svg.append(svgEl("line", {x1: node.x, y1: Math.min(...children.map(c => c.y)), x2: node.x, y2: Math.max(...children.map(c => c.y)), class: "connector"}));
      }
      for (const node of visibleNodes) {
        if (!node.parent_id) continue;
        const parent = nodes.get(node.parent_id);
        const branch = state.branches.get(node.branch_id) || {gain_count: 0, loss_count: 0};
        const hitLine = svgEl("line", {x1: parent.x, y1: node.y, x2: node.x, y2: node.y, class: "branch-hit", "data-branch": node.branch_id});
        svg.append(hitLine);
        const line = svgEl("line", {x1: parent.x, y1: node.y, x2: node.x, y2: node.y, class: `branch${state.selectedBranch === node.branch_id ? " selected" : ""}`, "data-branch": node.branch_id});
        svg.append(line);
        const label = svgEl("text", {x: (parent.x + node.x) / 2, y: node.y - 5, "text-anchor": "middle", class: "branch-label", "data-branch": node.branch_id, role: "button", tabindex: "0", "aria-label": `Branch ${node.branch_id}`});
        const gain = svgEl("tspan", {class: "gain-value"}); gain.textContent = `+${branch.gain_count}`;
        const loss = svgEl("tspan", {class: "loss-value", dx: "5"}); loss.textContent = `−${branch.loss_count}`;
        label.append(gain, loss); svg.append(label);
        const phenotypeEvent = state.phenotypeEvents.get(node.branch_id);
        if (phenotypeEvent) svg.append(svgEl("circle", {cx: node.x, cy: node.y, r: 5.5, class: phenotypeEvent === "gain" ? "phenotype-gain" : "phenotype-loss"}));
        else svg.append(svgEl("circle", {cx: node.x, cy: node.y, r: 2.8, class: "node-dot"}));
        if (node.collapsed) {

    function openDetailPanel() {

    async function selectBranch(branchId) {

    async function renderBranchEnrichment(container, branchId, source) {
      container.replaceChildren();

      const sourceQuery = encodeURIComponent(source);
      const [gain, loss] = await Promise.all([
        api(`/api/enrichment?branch=${encodeURIComponent(branchId)}&event=gain&limit=20&source=${sourceQuery}`),
        api(`/api/enrichment?branch=${encodeURIComponent(branchId)}&event=loss&limit=20&source=${sourceQuery}`)
      ]);
      if (state.selectedBranch !== branchId || state.enrichmentSource !== source) return;
      container.replaceChildren();
      appendEnrichment(container, gain, "Gained-family enrichment");
      appendEnrichment(container, loss, "Lost-family enrichment");

    function appendEnrichment(body, enrichment, heading) {
      const section = document.createElement("section"); section.className = "enrichment-section";
      const title = document.createElement("div"); title.className = "section-title"; title.textContent = heading; section.append(title);
      if (!enrichment.foreground) { const empty = document.createElement("div"); empty.className = "empty"; empty.textContent = "No gene-family events on this branch."; section.append(empty); body.append(section); return; }
      const significant = enrichment.results.filter(row => row.q_value <= 0.05);
      if (!significant.length) { const empty = document.createElement("div"); empty.className = "empty"; empty.textContent = "No enriched terms at FDR ≤ 0.05."; section.append(empty); body.append(section); return; }
      const plotted = significant.slice(0, 15);
      const counts = plotted.map(row => Number(row.overlap));
      const fdrValues = plotted.map(row => Math.max(Number(row.q_value), 1e-300));
      const axis = niceCountAxis(Math.max(...counts, 1));
      const fdrMinimum = Math.min(...fdrValues);
      const fdrMaximum = 0.05;
      const layout = document.createElement("div"); layout.className = "chart-layout";
      const chart = document.createElement("div"); chart.className = "enrichment-chart"; chart.setAttribute("role", "img"); chart.setAttribute("aria-label", `${heading}; bar length is gene-family count and color is FDR`);
      const caption = document.createElement("div"); caption.className = "chart-caption"; caption.textContent = `Top significant ${enrichment.source} terms · bar length = hits`; chart.append(caption);
      plotted.forEach((row, index) => {
        const chartRow = document.createElement("div"); chartRow.className = "chart-row";
        const term = document.createElement("div"); term.className = "chart-term"; term.textContent = row.term_name || row.term_id; term.title = `${row.source}: ${row.term_id}`;
        const track = document.createElement("div"); track.className = "chart-track";
        for (let tick = axis.step; tick <= axis.maximum; tick += axis.step) {
          const gridLine = document.createElement("span"); gridLine.className = "chart-grid-line"; gridLine.style.left = `${tick / axis.maximum * 100}%`; track.append(gridLine);
        }
        const bar = document.createElement("div"); bar.className = "chart-bar"; bar.style.width = `${Math.max(2, counts[index] / axis.maximum * 100)}%`; bar.style.backgroundColor = fdrColor(fdrValues[index], fdrMinimum, fdrMaximum); track.append(bar);
        const score = document.createElement("div"); score.className = "chart-score"; score.textContent = number(counts[index]);
        chartRow.append(term, track, score); chart.append(chartRow);
      });
      const axisRow = document.createElement("div"); axisRow.className = "chart-axis-row";
      const spacer = document.createElement("span");
      const axisNode = document.createElement("div"); axisNode.className = "chart-axis";
      for (let tick = 0; tick <= axis.maximum + axis.step / 2; tick += axis.step) {
        const tickNode = document.createElement("span"); tickNode.className = "chart-tick"; tickNode.style.left = `${tick / axis.maximum * 100}%`;
        const tickLabel = document.createElement("span"); tickLabel.textContent = formatAxisTick(tick, axis.step); tickNode.append(tickLabel); axisNode.append(tickNode);
      }
      const axisLabel = document.createElement("span"); axisLabel.className = "chart-axis-label"; axisLabel.textContent = "Count";
      axisRow.append(spacer, axisNode, axisLabel); chart.append(axisRow);
      layout.append(chart, createFdrLegend(fdrMinimum, fdrMaximum)); section.append(layout);
      const table = document.createElement("table"); table.className = "enrichment-table";
      table.innerHTML = "<thead><tr><th>Term</th><th>Hits</th><th>Background</th><th>Fold</th><th>FDR</th></tr></thead>";
      const tbody = document.createElement("tbody");
      for (const row of significant) {
        const tr = document.createElement("tr");
        const term = document.createElement("td"); term.textContent = row.term_name || row.term_id;
        if ((row.term_name || row.term_id) !== row.term_id) { const id = document.createElement("span"); id.className = "term-id"; id.textContent = row.term_id; term.append(id); }
        const hits = document.createElement("td"); hits.className = "number-cell"; hits.textContent = `${row.overlap}/${row.foreground}`;
        const background = document.createElement("td"); background.className = "number-cell"; background.textContent = `${row.term_total}/${row.universe}`;
        const fold = document.createElement("td"); fold.className = "number-cell"; fold.textContent = `${formatFold(row.fold_enrichment)}×`;
        const fdr = document.createElement("td"); fdr.className = "number-cell"; fdr.textContent = formatProbability(row.q_value);
        tr.append(term, hits, background, fold, fdr); tbody.append(tr);

    }
    function niceCountAxis(value) {
      const rawStep = value / 5;
      const magnitude = 10 ** Math.floor(Math.log10(rawStep));
      const fraction = rawStep / magnitude;
      const step = Math.max(1, (fraction <= 1 ? 1 : fraction <= 2 ? 2 : fraction <= 5 ? 5 : 10) * magnitude);
      return { step, maximum: Math.ceil(value / step) * step };
    }
    function formatAxisTick(value) { return number(value); }
    function fdrColor(value, minimum, maximum) {
      const denominator = Math.log10(maximum) - Math.log10(minimum);
      const position = denominator > 0 ? Math.min(1, Math.max(0, (Math.log10(value) - Math.log10(minimum)) / denominator)) : 0;
      const stops = position <= 0.5
        ? [[245, 28, 52], [201, 0, 170], position * 2]
        : [[201, 0, 170], [35, 52, 235], (position - 0.5) * 2];
      const rgb = stops[0].map((channel, index) => Math.round(channel + (stops[1][index] - channel) * stops[2]));
      return `rgb(${rgb.join(",")})`;
    }
    function createFdrLegend(minimum, maximum) {

      const title = document.createElement("div"); title.className = "fdr-legend-title"; title.textContent = "FDR"; legend.append(title);

        const swatch = document.createElement("span"); swatch.className = "fdr-swatch"; swatch.style.backgroundColor = fdrColor(value, minimum, maximum);
        const label = document.createElement("span"); label.textContent = formatProbability(value);
        step.append(swatch, label); legend.append(step);
      }
      const direction = document.createElement("div"); direction.className = "fdr-direction"; direction.textContent = "red = lower"; legend.append(direction);
      return legend;
    }
    function formatProbability(value) { return value < 0.001 ? Number(value).toExponential(1) : Number(value).toFixed(3); }
    function formatFold(value) { return value >= 10 ? Number(value).toFixed(0) : Number(value).toFixed(1); }
    async function showFamily(familyId, returnContext = null) {
      openDetailPanel();
      resetDetailScroll();
      if (returnContext?.type === "branch") configureDetailBack(`← Back to ${returnContext.branchId}`, () => selectBranch(returnContext.branchId));
      else if (returnContext?.type === "candidates") configureDetailBack("← Back to candidates", showCandidates);

      const result = await api(`/api/family?id=${encodeURIComponent(familyId)}`);
      $("detailTitle").textContent = familyId; $("detailSubtitle").textContent = "Gene-family members";
      const body = $("detailBody"); body.replaceChildren();

        const functionTitle = document.createElement("div"); functionTitle.className = "section-title"; functionTitle.textContent = "Functional annotation"; body.append(functionTitle);
        if (result.preferred_name) { const name = document.createElement("div"); name.className = "function-name"; name.textContent = result.preferred_name; body.append(name); }
        if (result.description) { const description = document.createElement("div"); description.className = "function-description"; description.textContent = result.description; body.append(description); }
        if (result.annotations?.length) { const terms = document.createElement("div"); terms.className = "annotation-list"; terms.textContent = result.annotations.map(item => `${item.source}: ${item.term_name || item.term_id}`).join(" · "); body.append(terms); }
      }

      const eventText = document.createElement("div"); eventText.textContent = result.events.map(e => `${e.branch_id} ${e.event}`).join(" · ") || "No transitions"; body.append(eventText);
      const memberTitle = document.createElement("div"); memberTitle.className = "section-title"; memberTitle.textContent = "Genes by species"; body.append(memberTitle);
      const entries = Object.entries(result.members);
      if (!entries.length) { const empty = document.createElement("div"); empty.className = "empty"; empty.textContent = "Gene members were not indexed."; body.append(empty); }
      const memberList = document.createElement("div"); memberList.className = "member-list";
      for (const [species, genes] of entries) {

        const geneNode = document.createElement("div"); geneNode.className = "genes"; geneNode.textContent = genes.join(", ");

    async function phenotypeChanged() {

    async function showCandidates() {

      const rows = await api(`/api/candidates?phenotype=${encodeURIComponent(phenotype)}&limit=200`);

    function enableDetailResize() {
      const panel = document.querySelector(".detail-panel");
      const workspace = document.querySelector(".workspace");
      const handle = $("detailResizeHandle");
      const storedWidth = Number(localStorage.getItem("species-map-detail-width"));
      if (Number.isFinite(storedWidth) && storedWidth > 0) panel.style.setProperty("--detail-panel-width", `${storedWidth}px`);
      const limits = () => {
        const maximum = Math.max(320, workspace.clientWidth - 40);
        return {minimum: Math.min(420, maximum), maximum};
      };
      const setWidth = width => {
        const {minimum, maximum} = limits();
        const next = Math.round(Math.min(maximum, Math.max(minimum, width)));
        panel.style.setProperty("--detail-panel-width", `${next}px`);
        handle.setAttribute("aria-valuemin", String(minimum));
        handle.setAttribute("aria-valuemax", String(maximum));
        handle.setAttribute("aria-valuenow", String(next));
        return next;
      };
      let active = false;
      let startX = 0;
      let startWidth = 0;
      handle.addEventListener("pointerdown", event => {
        if (event.button !== 0 || window.matchMedia("(max-width: 950px)").matches) return;
        active = true;
        startX = event.clientX;
        startWidth = panel.getBoundingClientRect().width;
        handle.setPointerCapture(event.pointerId);
        document.body.classList.add("detail-resizing");
        event.preventDefault();
      });
      handle.addEventListener("pointermove", event => {
        if (!active) return;
        setWidth(startWidth + startX - event.clientX);
      });
      const finishResize = event => {
        if (!active) return;
        active = false;
        document.body.classList.remove("detail-resizing");
        if (handle.hasPointerCapture(event.pointerId)) handle.releasePointerCapture(event.pointerId);
        localStorage.setItem("species-map-detail-width", String(Math.round(panel.getBoundingClientRect().width)));
      };
      handle.addEventListener("pointerup", finishResize);
      handle.addEventListener("pointercancel", finishResize);
      handle.addEventListener("keydown", event => {
        if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
        const delta = event.key === "ArrowLeft" ? 40 : -40;
        const next = setWidth(panel.getBoundingClientRect().width + delta);
        localStorage.setItem("species-map-detail-width", String(next));
        event.preventDefault();
      });
      window.addEventListener("resize", () => {
        if (!window.matchMedia("(max-width: 950px)").matches) setWidth(panel.getBoundingClientRect().width);
      });
      setWidth(storedWidth || 760);
    }
    function enableTreePan() {
      const viewport = $("treeViewport");
      let active = false;
      let moved = false;
      let startX = 0;
      let startY = 0;
      let startLeft = 0;
      let startTop = 0;
      let pendingBranch = null;
      let pendingExpandNode = null;
      let lastPointerSelection = 0;
      viewport.addEventListener("pointerdown", event => {
        if (event.button !== 0) return;
        active = true;
        moved = false;
        pendingExpandNode = event.target.closest("[data-expand-node]")?.dataset.expandNode || null;
        pendingBranch = pendingExpandNode ? null : (event.target.closest("[data-branch]")?.dataset.branch || null);
        startX = event.clientX;
        startY = event.clientY;
        startLeft = viewport.scrollLeft;
        startTop = viewport.scrollTop;
        viewport.setPointerCapture(event.pointerId);
        viewport.classList.add("dragging");
      });
      viewport.addEventListener("pointermove", event => {
        if (!active) return;
        const dx = event.clientX - startX;
        const dy = event.clientY - startY;
        if (Math.abs(dx) > 10 || Math.abs(dy) > 10) moved = true;
        if (!moved) return;
        viewport.scrollLeft = startLeft - dx;
        viewport.scrollTop = startTop - dy;
        event.preventDefault();
      });
      const finishPan = event => {
        if (!active) return;
        active = false;
        viewport.classList.remove("dragging");
        if (viewport.hasPointerCapture(event.pointerId)) viewport.releasePointerCapture(event.pointerId);
        if (!moved && pendingExpandNode) {
          state.expandedGroups.add(`${state.collapseRank}:${pendingExpandNode}`);
          renderTree();
        } else if (!moved && pendingBranch) {
          lastPointerSelection = Date.now();
          selectBranch(pendingBranch);
        }
        pendingBranch = null;
        pendingExpandNode = null;
      };
      viewport.addEventListener("pointerup", finishPan);
      viewport.addEventListener("pointercancel", finishPan);
      viewport.addEventListener("click", event => {
        if (Date.now() - lastPointerSelection < 250) return;
        const branch = event.target.closest("[data-branch]")?.dataset.branch;
        if (branch) selectBranch(branch);
      });
      viewport.addEventListener("keydown", event => {
        if (event.key !== "Enter" && event.key !== " ") return;
        const branch = event.target.closest("[data-branch]")?.dataset.branch;
        if (branch) { event.preventDefault(); selectBranch(branch); }
      });
    }
    enableTreePan();
    enableDetailResize();
    const themes = new Set(["white", "black", "brown", "green", "blue"]);
    function applyTheme(theme) {
      const selected = themes.has(theme) ? theme : "white";
      document.documentElement.dataset.theme = selected;
      document.querySelectorAll("[data-theme-value]").forEach(button => {
        const active = button.dataset.themeValue === selected;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      });
      localStorage.setItem("species-map-theme", selected);
    }
    document.querySelectorAll("[data-theme-value]").forEach(button => button.addEventListener("click", () => applyTheme(button.dataset.themeValue)));
    applyTheme(localStorage.getItem("species-map-theme") || "white");
    start();
  </script>
