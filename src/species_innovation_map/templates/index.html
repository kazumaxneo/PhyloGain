<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Gene Gain/Loss Viewer</title>
  <style>
    :root {
      --ink: #17212b;
      --muted: #66727f;
      --paper: #f4f6f8;
      --panel: #ffffff;
      --detail-panel: #fbfcfd;
      --line: #d9dee3;
      --gain: #087f5b;
      --gain-text: #16a36a;
      --gain-soft: #dff5ec;
      --loss: #b42345;
      --loss-text: #df4f64;
      --loss-soft: #fde8ee;
      --accent: #214f72;
      --header: #ffffff;
      --header-ink: #17212b;
      --control: #ffffff;
      --tree-grid: rgba(33,79,114,.025);
      --shadow: 0 8px 24px rgba(32, 45, 54, .07);
    }
    html[data-theme="black"] { --ink: #f1f3f5; --muted: #aeb6bf; --paper: #111315; --panel: #1b1e21; --detail-panel: #202428; --line: #353b40; --gain-soft: #123c30; --loss-soft: #47202b; --accent: #8bb8d5; --header: #0c0d0e; --header-ink: #ffffff; --control: #24282c; --tree-grid: rgba(255,255,255,.035); --shadow: none; }
    html[data-theme="brown"] { --ink: #2d2824; --muted: #756a61; --paper: #eee8df; --panel: #faf7f2; --detail-panel: #f6f1ea; --line: #d7cdc0; --accent: #76553b; --header: #4b392c; --header-ink: #ffffff; --control: #fffdf9; --tree-grid: rgba(91,65,45,.04); }
    html[data-theme="green"] { --ink: #edf4f0; --muted: #a9bbb1; --paper: #102019; --panel: #182b22; --detail-panel: #1d3228; --line: #355044; --gain-soft: #214c3b; --loss-soft: #4b2730; --accent: #93c9ae; --header: #0a1912; --header-ink: #ffffff; --control: #21372c; --tree-grid: rgba(255,255,255,.035); --shadow: none; }
    html[data-theme="blue"] { --ink: #edf3f8; --muted: #aab8c5; --paper: #101c26; --panel: #192a38; --detail-panel: #1e3040; --line: #354c5f; --gain-soft: #174638; --loss-soft: #4a2632; --accent: #91c1df; --header: #0a1721; --header-ink: #ffffff; --control: #213746; --tree-grid: rgba(255,255,255,.035); --shadow: none; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: var(--ink);
      background: var(--paper);
      font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      flex: 0 0 auto;
      gap: 9px;
      padding: 12px 18px;
      color: var(--header-ink);
      background: var(--header);
      border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0; font: 650 19px/1.1 Georgia, serif; letter-spacing: .01em; white-space: nowrap; }
    .header-controls { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
    .header-controls label { color: var(--header-ink); font-size: 10px; opacity: .72; }
    .header-controls select, .header-controls button { min-width: 0; border-color: color-mix(in srgb, var(--header-ink) 25%, transparent); padding: 4px 7px; background: color-mix(in srgb, var(--header) 88%, var(--control)); color: var(--header-ink); font-size: 11px; }
    .header-field { display: inline-flex; align-items: center; gap: 4px; }
    .theme-picker { display: flex; align-items: center; gap: 4px; }
    .theme-picker button { width: 16px; height: 16px; padding: 0; border: 1px solid #7f878d; border-radius: 2px; background: var(--swatch); }
    .theme-picker button.active { border-color: var(--swatch); background: var(--swatch); box-shadow: 0 0 0 2px var(--header), 0 0 0 4px var(--accent); }
    .theme-picker button[data-theme-value="white"] { --swatch: #ffffff; }
    .theme-picker button[data-theme-value="black"] { --swatch: #17191b; }
    .theme-picker button[data-theme-value="brown"] { --swatch: #6b4f3b; }
    .theme-picker button[data-theme-value="green"] { --swatch: #173c2b; }
    .theme-picker button[data-theme-value="blue"] { --swatch: #173c57; }
    .summary {
      display: flex;
      align-items: baseline;
      flex-wrap: nowrap;
      gap: 4px 10px;
      min-width: 0;
      margin-left: auto;
    }
    .card {
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
      white-space: nowrap;
    }
    .card span { color: var(--header-ink); font-size: 11px; opacity: .72; }
    .card span::after { content: ":"; }
    .card strong { color: var(--header-ink); font-size: 11px; font-weight: 600; }
    .workspace {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      padding: 14px 20px 20px;
      overflow: hidden;
    }
    .map-panel, .detail-panel {
      min-height: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 9px;
      box-shadow: var(--shadow);
    }
    .map-panel { display: flex; flex-direction: column; width: 100%; height: 100%; }
    label { color: var(--muted); font-size: 12px; }
    select, button {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--control);
      color: var(--ink);
      padding: 7px 10px;
      font: inherit;
    }
    button { cursor: pointer; }
    button:hover { border-color: var(--accent); color: var(--accent); }
    .tree-tools { grid-column: 3; grid-row: 1; justify-self: start; display: flex; align-items: center; gap: 9px; }
    .tree-scale-control { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: 13px 16px; align-items: center; column-gap: 3px; width: 112px; color: var(--muted); white-space: nowrap; }
    .tree-scale-control label { grid-column: 1; grid-row: 1; overflow: hidden; font-size: 9px; line-height: 1; text-overflow: ellipsis; }
    .tree-scale-control input { grid-column: 1 / 3; grid-row: 2; width: 112px; margin: 0; accent-color: var(--accent); }
    .tree-scale-control output { grid-column: 2; grid-row: 1; width: 26px; color: var(--ink); font: 9px ui-monospace, SFMono-Regular, Consolas, monospace; text-align: right; }
    .legend { display: flex; gap: 13px; color: var(--muted); font-size: 12px; }
    .filter-status { grid-column: 5; grid-row: 1; justify-self: end; display: flex; align-items: center; gap: 14px; }
    .svg-download { border: 0; border-radius: 0; padding: 2px 0; background: transparent; color: var(--ink); font-size: 10px; white-space: nowrap; text-decoration: underline; text-underline-offset: 2px; }
    .svg-download:focus-visible { outline: none; color: var(--accent); text-decoration-thickness: 2px; }
    .dot { display: inline-block; width: 9px; height: 9px; margin-right: 4px; border-radius: 50%; }
    .dot.gain { background: var(--gain); }
    .dot.loss { background: var(--loss); }
    .branch-filters { display: grid; grid-template-columns: 280px 280px max-content max-content minmax(80px, 1fr); grid-template-rows: auto; align-items: center; gap: 10px 14px; min-height: 50px; padding: 7px 14px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 94%, var(--control)); }
    .range-filter { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: 13px 18px; align-items: center; column-gap: 4px; width: 280px; }
    .gain-filter { grid-column: 1; grid-row: 1; }
    .loss-filter { grid-column: 2; grid-row: 1; }
    .range-filter-name { grid-column: 1; grid-row: 1; color: var(--muted); font-size: 9px; font-weight: 400; line-height: 1; }
    .range-filter output { grid-column: 2; grid-row: 1; color: var(--ink); font: 9px ui-monospace, SFMono-Regular, Consolas, monospace; white-space: nowrap; }
    .dual-range { --low: 0%; --high: 100%; position: relative; grid-column: 1 / 3; grid-row: 2; width: 100%; height: 18px; background: linear-gradient(to right, var(--line) 0 var(--low), var(--accent) var(--low) var(--high), var(--line) var(--high) 100%); background-size: 100% 3px; background-position: center; background-repeat: no-repeat; }
    .dual-range input { position: absolute; inset: 0; width: 100%; height: 18px; margin: 0; padding: 0; appearance: none; background: transparent; pointer-events: none; }
    .dual-range input::-webkit-slider-runnable-track { height: 3px; background: transparent; }
    .dual-range input::-webkit-slider-thumb { width: 12px; height: 12px; margin-top: -4.5px; appearance: none; border: 1px solid var(--accent); border-radius: 50%; background: var(--panel); pointer-events: auto; cursor: ew-resize; }
    .dual-range input::-moz-range-track { height: 3px; background: transparent; }
    .dual-range input::-moz-range-thumb { width: 12px; height: 12px; border: 1px solid var(--accent); border-radius: 50%; background: var(--panel); pointer-events: auto; cursor: ew-resize; }
    .filter-reset { grid-column: 4; grid-row: 1; align-self: center; justify-self: start; border: 0; border-radius: 0; padding: 2px; background: transparent; color: var(--muted); font-size: 10px; text-decoration: underline; text-underline-offset: 2px; }
    .filter-match-count { color: var(--muted); font: 10px ui-monospace, SFMono-Regular, Consolas, monospace; white-space: nowrap; }
    .filtered-branch-label { opacity: .1; }
    #treeViewport { flex: 1; min-height: 0; overflow: auto; position: relative; cursor: grab; user-select: none; touch-action: none; }
    #treeViewport.dragging { cursor: grabbing; }
    .tree-action-hint { position: absolute; z-index: 4; color: var(--ink); font-size: 15px; font-weight: 500; line-height: 1; white-space: nowrap; pointer-events: none; text-shadow: 0 1px 2px var(--panel); }
    #treeSvg { display: block; background: linear-gradient(90deg, var(--tree-grid) 1px, transparent 1px); background-size: 110px 100%; }
    .branch-hit { fill: transparent; cursor: pointer; }
    .radial-branch-hit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; }
    .branch { stroke: #83909a; stroke-width: 1.5; pointer-events: none; transition: stroke .12s, stroke-width .12s; }
    .branch-hit:hover + .branch, .radial-branch-hit:hover + .branch, .branch.selected { stroke: var(--accent); stroke-width: 4; }
    .connector-hit { fill: transparent; cursor: ns-resize; }
    .connector { stroke: #a6afb5; stroke-width: 1.2; pointer-events: none; }
    .connector-hit:hover + .connector { stroke: var(--accent); stroke-width: 3; }
    .branch-label { font: 650 11px ui-monospace, SFMono-Regular, Consolas, monospace; cursor: pointer; }
    .support-label { fill: var(--muted); font: 9px ui-monospace, SFMono-Regular, Consolas, monospace; pointer-events: none; }
    .gain-value { fill: var(--gain-text); }
    .loss-value { fill: var(--loss-text); }
    .tip-label { font-size: 11px; fill: var(--ink); }
    .taxonomy-tip-label { font-size: 11px; font-weight: 650; fill: var(--accent); }
    .collapsed-label { font-size: 11px; font-weight: 650; fill: var(--accent); cursor: pointer; }
    .collapsed-marker { fill: var(--accent); opacity: .75; cursor: pointer; }
    .node-dot { fill: var(--panel); stroke: #7b8993; stroke-width: 1.2; }
    .phenotype-gain { fill: var(--gain); stroke: white; stroke-width: 2; }
    .phenotype-loss { fill: var(--loss); stroke: white; stroke-width: 2; }
    .detail-panel {
      position: absolute;
      z-index: 10;
      top: 14px;
      right: 20px;
      bottom: 20px;
      width: min(var(--detail-panel-width, 760px), calc(100% - 40px));
      background: var(--detail-panel);
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transform: translateX(calc(100% + 24px)) scale(.97);
      transform-origin: right center;
      transition: transform .2s ease, opacity .16s ease;
      box-shadow: 0 16px 44px rgba(20, 30, 38, .22);
    }
    .workspace.detail-open .detail-panel { opacity: 1; pointer-events: auto; transform: translateX(0) scale(1); }
    .detail-scroll { height: 100%; overflow: auto; }
    .detail-resize-handle {
      position: absolute;
      z-index: 3;
      top: 0;
      bottom: 0;
      left: 0;
      width: 12px;
      border: 0;
      border-radius: 0;
      padding: 0;
      background: transparent;
      cursor: col-resize;
      touch-action: none;
    }
    .detail-resize-handle::after { content: ""; position: absolute; top: 0; bottom: 0; left: 5px; width: 1px; background: transparent; }
    .detail-resize-handle:hover::after, .detail-resize-handle:focus-visible::after, body.detail-resizing .detail-resize-handle::after { background: var(--accent); }
    body.detail-resizing { cursor: col-resize; user-select: none; }
    .detail-head { position: relative; padding: 17px 52px 13px 18px; border-bottom: 1px solid var(--line); }
    .detail-back { display: block; margin: 0 0 10px; border: 1px solid var(--accent); border-radius: 5px; padding: 5px 10px; background: var(--accent); color: var(--panel); font-size: 11px; font-weight: 700; line-height: 1.2; }
    .detail-back:hover { border-color: var(--accent); color: var(--panel); }
    .detail-back[hidden] { display: none; }
    .detail-close { position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; padding: 0; border: 0; background: transparent; font-size: 22px; line-height: 1; }
    .detail-head h2 { margin: 0; font: 650 18px/1.2 Georgia, serif; }
    .detail-head h2.family-title { color: var(--ink); font: 500 13px/1.3 Inter, ui-sans-serif, system-ui, sans-serif; }
    .detail-head p { margin: 5px 0 0; color: var(--muted); font-size: 12px; word-break: break-all; }
    .detail-body { padding: 18px 22px 28px; }
    .empty { color: var(--muted); padding: 24px 4px; }
    .counts { display: flex; gap: 22px; margin-bottom: 14px; color: var(--muted); font-size: 12px; }
    .count { padding: 0; }
    .count strong { margin-left: 5px; color: var(--ink); font-size: 12px; font-weight: 600; }
    .section-title { margin: 18px 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
    .enrichment-toolbar { display: flex; align-items: center; gap: 10px; margin: 8px 0 18px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
    .enrichment-toolbar label { color: var(--muted); font-size: 11px; }
    .enrichment-toolbar select { min-width: 210px; }
    .enrichment-method { margin-left: auto; color: var(--muted); font-size: 10px; }
    .enrichment-section { margin-bottom: 26px; }
    .chart-layout { display: grid; grid-template-columns: minmax(0, 1fr) 74px; gap: 14px; align-items: start; }
    .enrichment-chart { --term-column: minmax(280px, 38%); display: grid; gap: 7px; margin: 8px 0 14px; }
    .enrichment-chart.long-term-labels { --term-column: minmax(340px, 48%); }
    .chart-caption { color: var(--muted); font-size: 10px; margin-bottom: 2px; }
    .chart-row { display: grid; grid-template-columns: var(--term-column) minmax(180px, 1fr) 42px; align-items: center; gap: 9px; min-height: 25px; }
    .chart-term { color: var(--ink); font-size: 11px; line-height: 1.15; white-space: normal; }
    .chart-track { position: relative; height: 16px; background: transparent; border-left: 1px solid var(--muted); }
    .chart-grid-line { position: absolute; z-index: 0; top: 0; bottom: 0; width: 1px; background: var(--line); }
    .chart-bar { position: relative; z-index: 1; height: 100%; min-width: 2px; }
    .chart-score { color: var(--muted); font: 10px ui-monospace, SFMono-Regular, Consolas, monospace; text-align: right; }
    .chart-axis-row { display: grid; grid-template-columns: var(--term-column) minmax(180px, 1fr) 42px; align-items: start; gap: 9px; min-height: 25px; }
    .chart-axis { position: relative; height: 24px; border-top: 1px solid var(--muted); }
    .chart-tick { position: absolute; top: -4px; height: 5px; border-left: 1px solid var(--muted); }
    .chart-tick span { position: absolute; top: 7px; transform: translateX(-50%); color: var(--muted); font: 9px ui-monospace, SFMono-Regular, Consolas, monospace; }
    .chart-axis-label { color: var(--muted); font-size: 9px; line-height: 1.2; text-align: right; white-space: pre-line; }
    .fdr-legend { margin-top: 37px; color: var(--muted); font: 9px ui-monospace, SFMono-Regular, Consolas, monospace; }
    .fdr-legend-title { margin-bottom: 5px; color: var(--ink); font: 10px sans-serif; }
    .fdr-step { display: grid; grid-template-columns: 14px 1fr; align-items: center; gap: 5px; height: 25px; }
    .fdr-swatch { width: 14px; height: 25px; }
    .fdr-direction { margin-top: 5px; font: 9px sans-serif; line-height: 1.2; }
    .enrichment-table { table-layout: fixed; }
    .enrichment-table th:nth-child(1) { width: 42%; }
    .enrichment-table th:nth-child(2), .enrichment-table th:nth-child(3) { width: 17%; }
    .enrichment-table th:nth-child(4), .enrichment-table th:nth-child(5) { width: 12%; }
    .enrichment-table th:not(:first-child) { text-align: right; }
    .enrichment-table td { vertical-align: top; overflow-wrap: anywhere; }
    .enrichment-table td:first-child { font-weight: 550; }
    .term-id { display: block; margin-top: 2px; color: var(--muted); font: 10px ui-monospace, SFMono-Regular, Consolas, monospace; }
    .term-link { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
    .term-link:hover { color: var(--accent); }
    .inline-term-id { margin-left: 6px; font: 10px ui-monospace, SFMono-Regular, Consolas, monospace; }
    .number-cell { white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
    .event-list { display: grid; gap: 0; border-top: 1px solid var(--line); }
    .family-button { display: grid; grid-template-columns: 34px 92px minmax(0, 1fr); align-items: baseline; gap: 6px; width: 100%; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 4px 2px; background: transparent; color: var(--ink); text-align: left; }
    .family-button:hover { border-color: var(--line); background: var(--control); color: var(--ink); }
    .event-kind { color: var(--ink); font-size: 9px; font-weight: 400; text-transform: lowercase; }
    .family-id { color: var(--ink); font: 500 10px/1.25 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .family-description { overflow: hidden; color: var(--muted); font-size: 9px; line-height: 1.25; text-overflow: ellipsis; white-space: nowrap; }
    .functional-title { color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-weight: 650; text-decoration: underline; text-underline-offset: 3px; }
    .function-name, .function-description, .annotation-list { color: var(--ink); font: 650 12px/1.5 Inter, ui-sans-serif, system-ui, sans-serif; }
    .function-name { margin-bottom: 5px; }
    .annotation-list { margin-top: 8px; }
    .function-name::before, .function-description::before, .function-annotation::before { content: "・"; margin-right: 3px; }
    .tag { padding: 1px 6px; border-radius: 10px; font: 700 10px/1.5 sans-serif; text-transform: uppercase; }
    .tag.gain { color: var(--gain); background: var(--gain-soft); }
    .tag.loss { color: var(--loss); background: var(--loss-soft); }
    .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
    .tabs button.active { color: white; border-color: var(--accent); background: var(--accent); }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th { color: var(--muted); text-align: left; font-weight: 600; border-bottom: 1px solid var(--line); padding: 7px 5px; }
    td { border-bottom: 1px solid var(--line); padding: 7px 5px; }
    td button { border: 0; padding: 0; color: var(--accent); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .member-list { display: grid; gap: 0; margin-top: 32px; }
    .member-row { padding: 4px 0; border-bottom: 1px solid var(--line); }
    .member-assembly { margin: 0 0 1px; color: var(--ink); font-size: 9px; font-weight: 400; line-height: 1.2; text-decoration: underline; text-underline-offset: 2px; word-break: break-all; }
    .genes { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 9px; line-height: 1.25; word-break: break-all; }
    #status { padding: 40px; color: var(--muted); }
    @media (max-width: 950px) {
      .detail-panel { left: 20px; width: auto; }
      .detail-resize-handle { display: none; }
      .chart-layout { grid-template-columns: minmax(0, 1fr) 64px; gap: 8px; }
      .branch-filters { grid-template-columns: 315px 315px minmax(100px, 1fr); grid-template-rows: auto auto; }
      .tree-tools { grid-column: 1; grid-row: 2; justify-self: start; }
      .filter-reset { grid-column: 2; grid-row: 2; justify-self: start; }
      .filter-status { grid-column: 3; grid-row: 1 / 3; }
    }
    @media (max-width: 1400px) {
      .summary .card:nth-child(3), .summary .card:last-child { display: none; }
      .filter-status .legend { display: none; }
      .filter-match-count { display: none; }
    }
    @media (max-width: 1180px) {
      .header-controls > label, .header-controls .header-field > label { display: none; }
    }
    @media (max-width: 760px) {
      header { flex-wrap: wrap; gap: 8px 12px; padding: 10px 14px; }
      .summary { width: 100%; margin-left: 0; gap: 4px 14px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="theme-picker" aria-label="Color theme">
      <button type="button" data-theme-value="white" aria-label="White theme" title="White"></button>
      <button type="button" data-theme-value="black" aria-label="Black theme" title="Black"></button>
      <button type="button" data-theme-value="brown" aria-label="Brown theme" title="Brown"></button>
      <button type="button" data-theme-value="green" aria-label="Green theme" title="Green"></button>
      <button type="button" data-theme-value="blue" aria-label="Blue theme" title="Blue"></button>
    </div>
    <h1>Gene Gain/Loss Viewer</h1>
    <div class="header-controls" aria-label="Tree controls">
      <label for="phenotypeSelect">Phenotype</label>
      <select id="phenotypeSelect" title="Phenotype"><option value="">None</option></select>
      <button id="candidateButton" type="button">Candidate genes</button>
      <span class="header-field" id="taxonomyControl" hidden>
        <label for="collapseSelect">Collapse</label>
        <select id="collapseSelect" title="Collapse taxonomic rank"><option value="">None</option></select>
      </span>
      <span class="header-field">
        <label for="treeOrderSelect">Order</label>
        <select id="treeOrderSelect" title="Order child clades" aria-label="Order child clades">
          <option value="original">Original</option>
          <option value="ascending">Ascending</option>
          <option value="descending">Descending</option>
        </select>

      <div class="detail-resize-handle" id="detailResizeHandle" role="separator" aria-label="Resize detail panel" aria-orientation="vertical" tabindex="0"></div>

  </main>
  <script>
    const SVG = "http://www.w3.org/2000/svg";
    const state = { project: null, branches: new Map(), phenotypeEvents: new Map(), selectedBranch: null, selectedEvent: null, collapseRank: "", supportThreshold: 0, treeOrder: "original", treeLayout: "rectangular", horizontalSpacing: 1, verticalSpacing: 1, tipFontSize: 9, expandedGroups: new Set(), manuallyCollapsed: new Set(), flippedNodes: new Set(), annotationSources: [], enrichmentSource: "", treeZoom: 1, branchFilter: {gainMin: 0, gainMax: 0, lossMin: 0, lossMax: 0} };
    const $ = id => document.getElementById(id);
    const number = value => Number(value || 0).toLocaleString();
    const svgEl = (name, attrs = {}) => {
      const node = document.createElementNS(SVG, name);
      for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
      return node;
    };
    function addSvgTooltip(node, text) {
      node.dataset.actionHint = text;
      return node;
    }
    async function api(path) {
      const response = await fetch(path);
      if (!response.ok) throw new Error((await response.json()).error || response.statusText);
      return response.json();
    }
    async function start() {
      try {
        const [project, branches, annotationSources] = await Promise.all([api("/api/project"), api("/api/branches"), api("/api/annotation-sources")]);
        state.project = project;
        state.branches = new Map(branches.map(branch => [branch.branch_id, branch]));
        initializeBranchFilters(branches);
        state.annotationSources = annotationSources;
        state.enrichmentSource = annotationSources.some(item => item.source === "KEGG pathway") ? "KEGG pathway" : (annotationSources[0]?.source || "");
        $("speciesCount").textContent = number(project.species_count);
        $("familyCount").textContent = number(project.family_count);
        $("branchCount").textContent = number(branches.length);
        for (const phenotype of project.phenotypes) {
          const option = document.createElement("option"); option.value = phenotype; option.textContent = phenotype;
          $("phenotypeSelect").append(option);
        }
        const rankLabels = {domain: "Domain", phylum: "Phylum", class: "Class", order: "Order", family: "Family", genus: "Genus", species: "Species"};
        const ranks = (project.taxonomy?.ranks || []).filter(rank => rank !== "domain" && rank !== "species");
        for (const rank of ranks) {
          const option = document.createElement("option"); option.value = rank; option.textContent = rankLabels[rank] || rank;
          $("collapseSelect").append(option);
        }
        $("taxonomyControl").hidden = ranks.length === 0;
        $("status").remove();
        renderTree();
      } catch (error) {
        $("status").textContent = "The viewer needs the local API. Run: species-map serve <output-directory>";
        console.error(error);
      }
    }
    function initializeBranchFilters(branches) {
      const maxima = {
        gain: Math.max(0, ...branches.map(branch => Number(branch.gain_count || 0))),
        loss: Math.max(0, ...branches.map(branch => Number(branch.loss_count || 0)))
      };
      for (const kind of ["gain", "loss"]) {
        const minimum = $(`${kind}Min`); const maximum = $(`${kind}Max`);
        minimum.min = 0; minimum.max = maxima[kind]; minimum.step = 1; minimum.value = 0;
        maximum.min = 0; maximum.max = maxima[kind]; maximum.step = 1; maximum.value = maxima[kind];
        minimum.addEventListener("input", () => syncBranchFilters(kind, "minimum"));
        maximum.addEventListener("input", () => syncBranchFilters(kind, "maximum"));
      }
      $("filterReset").addEventListener("click", () => {
        $("gainMin").value = 0; $("gainMax").value = maxima.gain;
        $("lossMin").value = 0; $("lossMax").value = maxima.loss;
        syncBranchFilters();
      });
      syncBranchFilters(null, null, false);
    }
    function syncBranchFilters(changedKind = null, changedHandle = null, rerender = true) {
      for (const kind of ["gain", "loss"]) {
        const minimum = $(`${kind}Min`); const maximum = $(`${kind}Max`);
        if (Number(minimum.value) > Number(maximum.value)) {
          if (kind === changedKind && changedHandle === "minimum") maximum.value = minimum.value;
          else minimum.value = maximum.value;
        }
        const low = Number(minimum.value); const high = Number(maximum.value); const upper = Math.max(Number(maximum.max), 1);
        state.branchFilter[`${kind}Min`] = low; state.branchFilter[`${kind}Max`] = high;
        $(`${kind}Range`).style.setProperty("--low", `${low / upper * 100}%`);
        $(`${kind}Range`).style.setProperty("--high", `${high / upper * 100}%`);
        $(`${kind}RangeValue`).textContent = `${number(low)}–${number(high)}`;
      }
      const matched = [...state.branches.values()].filter(branchMatchesFilter).length;
      $("filterMatchCount").textContent = `${number(matched)} / ${number(state.branches.size)} branches`;
      if (rerender && state.project) renderTree();
    }
    function branchMatchesFilter(branch) {
      return branchValueMatchesFilter(branch, "gain") && branchValueMatchesFilter(branch, "loss");
    }
    function branchValueMatchesFilter(branch, kind) {
      const value = Number(branch[`${kind}_count`] || 0);
      return value >= state.branchFilter[`${kind}Min`] && value <= state.branchFilter[`${kind}Max`];
    }
    function normalizedBranchSupport(node) {
      let value = node.support;
      if (value == null && !node.is_leaf && /^\s*\d+(?:\.\d+)?\s*$/.test(node.label || "")) value = Number(node.label);
      value = Number(value);
      if (!Number.isFinite(value) || value < 0 || value > 100) return null;
      return value > 1 ? value / 100 : value;
    }
    function renderTree() {
      const svg = $("treeSvg"); svg.replaceChildren();
      const zoom = state.treeZoom;
      const canvas = svgEl("g", {transform: `scale(${zoom})`});
      svg.append(canvas);
      const nodes = new Map(state.project.nodes.map(node => [node.id, {...node}]));
      const root = [...nodes.values()].find(node => !node.parent_id);
      const taxonomy = state.project.taxonomy?.species || {};
      const rank = state.collapseRank;
      const cladeSizes = new Map();
      function cladeSize(node) {
        if (cladeSizes.has(node.id)) return cladeSizes.get(node.id);
        const size = node.children.length ? node.children.reduce((sum, id) => sum + cladeSize(nodes.get(id)), 0) : 1;
        cladeSizes.set(node.id, size);
        return size;
      }
      cladeSize(root);
      function childNodes(node) {
        let ids = [...node.children];
        if (state.treeOrder !== "original") {
          const direction = state.treeOrder === "ascending" ? 1 : -1;
          ids.sort((left, right) => direction * (cladeSizes.get(left) - cladeSizes.get(right)) || left.localeCompare(right));
        }
        if (state.flippedNodes.has(node.id)) ids.reverse();
        return ids.map(id => nodes.get(id));
      }
      function summarize(node) {
        const children = childNodes(node);
        if (!children.length) {
          node.leafCount = 1;
          node.rankValue = rank ? (taxonomy[node.label]?.[rank] || "") : "";
          return;
        }
        children.forEach(summarize);
        node.leafCount = children.reduce((sum, child) => sum + child.leafCount, 0);
        const values = new Set(children.map(child => child.rankValue));
        node.rankValue = values.size === 1 && !values.has("") ? [...values][0] : "";
        node.taxonomyCollapsed = Boolean(
          rank && node.parent_id && node.rankValue && node.leafCount > 1 &&
          !state.expandedGroups.has(`${rank}:${node.id}`)
        );
        const support = normalizedBranchSupport(node);
        node.supportCollapsed = Boolean(
          state.supportThreshold > 0 && node.parent_id && support != null && support < state.supportThreshold &&
          !state.expandedGroups.has(`support:${state.supportThreshold}:${node.id}`)
        );
        node.collapsed = state.manuallyCollapsed.has(node.id) || node.taxonomyCollapsed || node.supportCollapsed;
      }
      summarize(root);
      const visibleNodes = [];
      function collect(node) {
        visibleNodes.push(node);
        if (!node.collapsed) childNodes(node).forEach(collect);
      }
      collect(root);
      const visibleIds = new Set(visibleNodes.map(node => node.id));
      if (state.treeLayout !== "rectangular") {
        const terminals = [];
        function assignAngles(node) {
          const children = node.collapsed ? [] : childNodes(node).filter(child => visibleIds.has(child.id));
          if (!children.length) {
            terminals.push(node);
            return;
          }
          children.forEach(assignAngles);
        }
        assignAngles(root);
        terminals.forEach((node, index) => { node.angle = -Math.PI / 2 + index * Math.PI * 2 / Math.max(1, terminals.length); });
        function averageAngles(node) {
          const children = node.collapsed ? [] : childNodes(node).filter(child => visibleIds.has(child.id));
          children.forEach(averageAngles);
          if (children.length) node.angle = children.reduce((sum, child) => sum + child.angle, 0) / children.length;
        }
        averageAngles(root);
        const maxDepth = Math.max(1, ...visibleNodes.map(node => node.depth));
        const circumferenceRadius = terminals.length * 18 * state.verticalSpacing / (Math.PI * 2);
        const radialStep = Math.max(55 * state.horizontalSpacing, circumferenceRadius / maxDepth);
        const outerRadius = 28 + maxDepth * radialStep;
        const margin = 230;
        const baseSize = Math.max(760, (outerRadius + margin) * 2);
        const center = baseSize / 2;
        visibleNodes.forEach(node => {
          node.radius = 28 + node.depth * radialStep;
          node.x = center + node.radius * Math.cos(node.angle);
          node.y = center + node.radius * Math.sin(node.angle);
        });
        svg.setAttribute("width", baseSize * zoom);
        svg.setAttribute("height", baseSize * zoom);
        svg.style.backgroundImage = "none";
        function radialPath(parent, node) {
          const turnX = center + parent.radius * Math.cos(node.angle);
          const turnY = center + parent.radius * Math.sin(node.angle);
          const delta = node.angle - parent.angle;
          const largeArc = Math.abs(delta) > Math.PI ? 1 : 0;
          const sweep = delta >= 0 ? 1 : 0;
          return `M ${parent.x} ${parent.y} A ${parent.radius} ${parent.radius} 0 ${largeArc} ${sweep} ${turnX} ${turnY} L ${node.x} ${node.y}`;
        }
        for (const node of visibleNodes) {
          if (!node.parent_id) continue;
          const parent = nodes.get(node.parent_id);
          const branch = state.branches.get(node.branch_id) || {gain_count: 0, loss_count: 0};
          const pathData = radialPath(parent, node);
          const hitAttributes = {d: pathData, class: "radial-branch-hit"};
          if (!node.is_leaf) Object.assign(hitAttributes, {"data-collapse-node": node.id, role: "button", tabindex: "0", "aria-label": `${node.collapsed ? "Expand" : "Collapse"} clade at branch ${node.branch_id}`});
          const hitPath = svgEl("path", hitAttributes);
          if (!node.is_leaf) addSvgTooltip(hitPath, node.collapsed ? "Expand clade" : "Collapse clade");
          canvas.append(hitPath);
          canvas.append(svgEl("path", {d: pathData, class: `branch${state.selectedBranch === node.branch_id ? " selected" : ""}`, "data-branch": node.branch_id, fill: "none"}));
          const middleX = (parent.x + node.x) / 2;
          const middleY = (parent.y + node.y) / 2;
          const label = svgEl("text", {x: middleX, y: middleY - 5, "text-anchor": "middle", class: "branch-label", style: "font-size: 9px", "data-branch": node.branch_id, role: "button", tabindex: "0", "aria-label": `Branch ${node.branch_id}`});
          const gainClass = branchValueMatchesFilter(branch, "gain") ? "gain-value" : "gain-value filtered-branch-label";
          const lossClass = branchValueMatchesFilter(branch, "loss") ? "loss-value" : "loss-value filtered-branch-label";
          const gain = svgEl("tspan", {class: gainClass, "data-branch": node.branch_id, "data-event": "gain", role: "button", tabindex: "0", "aria-label": `Gained gene families on branch ${node.branch_id}`}); gain.textContent = `+${branch.gain_count}`;
          const loss = svgEl("tspan", {class: lossClass, "data-branch": node.branch_id, "data-event": "loss", role: "button", tabindex: "0", "aria-label": `Lost gene families on branch ${node.branch_id}`, dx: "5"}); loss.textContent = `−${branch.loss_count}`;
          label.append(gain, loss); canvas.append(label);
          const support = normalizedBranchSupport(node);
          if (support != null) {
            const supportLabel = svgEl("text", {x: middleX, y: middleY + 11, "text-anchor": "middle", class: "support-label"});
            supportLabel.textContent = support.toFixed(3);
            canvas.append(supportLabel);
          }
          const phenotypeEvent = state.phenotypeEvents.get(node.branch_id);
          if (phenotypeEvent) canvas.append(svgEl("circle", {cx: node.x, cy: node.y, r: 5.5, class: phenotypeEvent === "gain" ? "phenotype-gain" : "phenotype-loss"}));
          else canvas.append(svgEl("circle", {cx: node.x, cy: node.y, r: 2.8, class: "node-dot"}));
          const ux = Math.cos(node.angle);
          const uy = Math.sin(node.angle);
          const anchor = ux >= 0 ? "start" : "end";
          const labelAngle = node.angle * 180 / Math.PI + (ux < 0 ? 180 : 0);
          if (node.collapsed) {
            const px = -uy;
            const py = ux;
            const baseX = node.x + ux * 3;
            const baseY = node.y + uy * 3;
            const tipX = node.x + ux * 16;
            const tipY = node.y + uy * 16;
            const marker = svgEl("polygon", {points: `${baseX + px * 6},${baseY + py * 6} ${tipX},${tipY} ${baseX - px * 6},${baseY - py * 6}`, class: "collapsed-marker", "data-expand-node": node.id});
            const labelX = node.x + ux * 23;
            const labelY = node.y + uy * 23;
            const tip = svgEl("text", {x: labelX, y: labelY, "text-anchor": anchor, "dominant-baseline": "middle", transform: `rotate(${labelAngle} ${labelX} ${labelY})`, style: `font-size: ${state.tipFontSize}px`, class: "collapsed-label", "data-expand-node": node.id});
            tip.textContent = node.taxonomyCollapsed && node.rankValue ? `${node.rankValue} (${number(node.leafCount)})` : `Collapsed clade (${number(node.leafCount)} tips)`;
            addSvgTooltip(marker, "Expand clade");
            addSvgTooltip(tip, "Expand clade");
            canvas.append(marker, tip);
          } else if (node.is_leaf) {
            const taxonomyLabel = rank && node.rankValue ? `${node.rankValue} (1)` : node.label;
            const tipClass = rank && node.rankValue ? "taxonomy-tip-label" : "tip-label";
            const labelX = node.x + ux * 10;
            const labelY = node.y + uy * 10;
            const tip = svgEl("text", {x: labelX, y: labelY, "text-anchor": anchor, "dominant-baseline": "middle", transform: `rotate(${labelAngle} ${labelX} ${labelY})`, style: `font-size: ${state.tipFontSize}px`, class: tipClass});
            tip.textContent = taxonomyLabel;
            canvas.append(tip);
          }
        }
        return;
      }
      svg.style.backgroundImage = "linear-gradient(90deg, var(--tree-grid) 1px, transparent 1px)";
      let leafIndex = 0;
      const spacing = 25 * state.verticalSpacing;
      const depthSpacing = 110 * state.horizontalSpacing;
      function position(node) {
        const children = node.collapsed ? [] : childNodes(node);
        children.forEach(position);
        node.x = 35 + node.depth * depthSpacing;
        node.y = children.length ? children.reduce((sum, child) => sum + child.y, 0) / children.length : 24 + leafIndex++ * spacing;
      }
      position(root);
      const maxDepth = Math.max(...visibleNodes.map(node => node.depth));
      const baseWidth = Math.max(900, depthSpacing * maxDepth + 440);
      const baseHeight = Math.max(500, leafIndex * spacing + 40);
      svg.setAttribute("width", baseWidth * zoom);
      svg.setAttribute("height", baseHeight * zoom);
      svg.style.backgroundSize = `${depthSpacing * zoom}px 100%`;
      for (const node of visibleNodes) {
        const children = node.collapsed ? [] : childNodes(node).filter(child => visibleIds.has(child.id));
        if (children.length > 1) {
          const minimumY = Math.min(...children.map(c => c.y));
          const maximumY = Math.max(...children.map(c => c.y));
          const connectorAttributes = {x1: node.x, y1: minimumY, x2: node.x, y2: maximumY};
          const connectorHit = svgEl("rect", {x: node.x - 7, y: minimumY, width: 14, height: Math.max(14, maximumY - minimumY), class: "connector-hit", "data-flip-node": node.id, role: "button", tabindex: "0", "aria-label": `Flip child clades at node ${node.id}`});
          canvas.append(addSvgTooltip(connectorHit, "Flip clades"));
          canvas.append(svgEl("line", {...connectorAttributes, class: "connector"}));
        }
      }
      for (const node of visibleNodes) {
        if (!node.parent_id) continue;
        const parent = nodes.get(node.parent_id);
        const branch = state.branches.get(node.branch_id) || {gain_count: 0, loss_count: 0};
        const hitAttributes = {x: parent.x, y: node.y - 7, width: Math.max(14, node.x - parent.x), height: 14, class: "branch-hit"};
        if (!node.is_leaf) Object.assign(hitAttributes, {"data-collapse-node": node.id, role: "button", tabindex: "0", "aria-label": `${node.collapsed ? "Expand" : "Collapse"} clade at branch ${node.branch_id}`});
        const hitLine = svgEl("rect", hitAttributes);
        if (!node.is_leaf) addSvgTooltip(hitLine, node.collapsed ? "Expand clade" : "Collapse clade");
        canvas.append(hitLine);
        const line = svgEl("line", {x1: parent.x, y1: node.y, x2: node.x, y2: node.y, class: `branch${state.selectedBranch === node.branch_id ? " selected" : ""}`, "data-branch": node.branch_id});
        canvas.append(line);
        const label = svgEl("text", {x: (parent.x + node.x) / 2, y: node.y - 5, "text-anchor": "middle", class: "branch-label", "data-branch": node.branch_id, role: "button", tabindex: "0", "aria-label": `Branch ${node.branch_id}`});
        const gainClass = branchValueMatchesFilter(branch, "gain") ? "gain-value" : "gain-value filtered-branch-label";
        const lossClass = branchValueMatchesFilter(branch, "loss") ? "loss-value" : "loss-value filtered-branch-label";
        const gain = svgEl("tspan", {class: gainClass, "data-branch": node.branch_id, "data-event": "gain", role: "button", tabindex: "0", "aria-label": `Gained gene families on branch ${node.branch_id}`}); gain.textContent = `+${branch.gain_count}`;
        const loss = svgEl("tspan", {class: lossClass, "data-branch": node.branch_id, "data-event": "loss", role: "button", tabindex: "0", "aria-label": `Lost gene families on branch ${node.branch_id}`, dx: "5"}); loss.textContent = `−${branch.loss_count}`;
        label.append(gain, loss); canvas.append(label);
        const support = normalizedBranchSupport(node);
        if (support != null) {
          const supportLabel = svgEl("text", {x: (parent.x + node.x) / 2, y: node.y + 11, "text-anchor": "middle", class: "support-label"});
          supportLabel.textContent = support.toFixed(3);
          canvas.append(supportLabel);
        }
        const phenotypeEvent = state.phenotypeEvents.get(node.branch_id);
        if (phenotypeEvent) canvas.append(svgEl("circle", {cx: node.x, cy: node.y, r: 5.5, class: phenotypeEvent === "gain" ? "phenotype-gain" : "phenotype-loss"}));
        else canvas.append(svgEl("circle", {cx: node.x, cy: node.y, r: 2.8, class: "node-dot"}));
        if (node.collapsed) {

      $("detailSubtitle").hidden = false;
      $("detailSubtitle").textContent = phenotype ? `Coincident with ${phenotype} gains` : "Select a phenotype first";
      const body = $("detailBody"); body.replaceChildren();
      if (!phenotype) { const empty = document.createElement("div"); empty.className = "empty"; empty.textContent = "Choose a phenotype from the toolbar."; body.append(empty); return; }
      const rows = await api(`/api/candidates?phenotype=${encodeURIComponent(phenotype)}&limit=200`);
      const table = document.createElement("table");
      table.innerHTML = "<thead><tr><th>Family</th><th>Score</th><th>Family gains</th></tr></thead>";
      const tbody = document.createElement("tbody");
      for (const row of rows) {
        const tr = document.createElement("tr"); const familyCell = document.createElement("td"); const button = document.createElement("button"); button.textContent = row.family_id; button.addEventListener("click", () => showFamily(row.family_id, {type: "candidates"})); familyCell.append(button);
        const score = document.createElement("td"); score.textContent = row.score; const gains = document.createElement("td"); gains.textContent = row.family_gains; tr.append(familyCell, score, gains); tbody.append(tr);
      }
      table.append(tbody); body.append(table);
      if (!rows.length) { const empty = document.createElement("div"); empty.className = "empty"; empty.textContent = "No coincident gains were found."; body.append(empty); }
    }
    $("phenotypeSelect").addEventListener("change", phenotypeChanged);
    $("candidateButton").addEventListener("click", showCandidates);
    $("collapseSelect").addEventListener("change", event => {
      state.collapseRank = event.target.value;
      state.expandedGroups.clear();
      closeDetailPanel();
      $("treeViewport").scrollTo({top: 0, left: 0});
      renderTree();
    });
    $("treeOrderSelect").addEventListener("change", event => {
      state.treeOrder = event.target.value;
      state.flippedNodes.clear();
      closeDetailPanel();
      $("treeViewport").scrollTo({top: 0, left: 0});
      renderTree();
    });
    $("supportCollapseSelect").addEventListener("change", event => {
      state.supportThreshold = Number(event.target.value);
      state.expandedGroups.clear();
      closeDetailPanel();
      $("treeViewport").scrollTo({top: 0, left: 0});
      renderTree();
    });
    $("downloadSvg").addEventListener("click", downloadCurrentTreeSvg);
    $("detailClose").addEventListener("click", closeDetailPanel);
    document.addEventListener("keydown", event => { if (event.key === "Escape") closeDetailPanel(); });
    function enableDetailResize() {
      const panel = document.querySelector(".detail-panel");
      const workspace = document.querySelector(".workspace");
      const handle = $("detailResizeHandle");
      const storedWidth = Number(localStorage.getItem("species-map-detail-width"));
      if (Number.isFinite(storedWidth) && storedWidth > 0) panel.style.setProperty("--detail-panel-width", `${storedWidth}px`);
      const limits = () => {
        const maximum = Math.max(320, workspace.clientWidth - 40);
        return {minimum: Math.min(420, maximum), maximum};
      };
      const setWidth = width => {
        const {minimum, maximum} = limits();
        const next = Math.round(Math.min(maximum, Math.max(minimum, width)));
        panel.style.setProperty("--detail-panel-width", `${next}px`);
        handle.setAttribute("aria-valuemin", String(minimum));
        handle.setAttribute("aria-valuemax", String(maximum));
        handle.setAttribute("aria-valuenow", String(next));
        return next;
      };
      let active = false;
      let startX = 0;
      let startWidth = 0;
      handle.addEventListener("pointerdown", event => {
        if (event.button !== 0 || window.matchMedia("(max-width: 950px)").matches) return;
        active = true;
        startX = event.clientX;
        startWidth = panel.getBoundingClientRect().width;
        handle.setPointerCapture(event.pointerId);
        document.body.classList.add("detail-resizing");
        event.preventDefault();
      });
      handle.addEventListener("pointermove", event => {
        if (!active) return;
        setWidth(startWidth + startX - event.clientX);
      });
      const finishResize = event => {
        if (!active) return;
        active = false;
        document.body.classList.remove("detail-resizing");
        if (handle.hasPointerCapture(event.pointerId)) handle.releasePointerCapture(event.pointerId);
        localStorage.setItem("species-map-detail-width", String(Math.round(panel.getBoundingClientRect().width)));
      };
      handle.addEventListener("pointerup", finishResize);
      handle.addEventListener("pointercancel", finishResize);
      handle.addEventListener("keydown", event => {
        if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
        const delta = event.key === "ArrowLeft" ? 40 : -40;
        const next = setWidth(panel.getBoundingClientRect().width + delta);
        localStorage.setItem("species-map-detail-width", String(next));
        event.preventDefault();
      });
      window.addEventListener("resize", () => {
        if (!window.matchMedia("(max-width: 950px)").matches) setWidth(panel.getBoundingClientRect().width);
      });
      setWidth(storedWidth || 760);
    }
    function expandCollapsedNode(nodeId) {
      state.manuallyCollapsed.delete(nodeId);
      if (state.collapseRank) state.expandedGroups.add(`${state.collapseRank}:${nodeId}`);
      if (state.supportThreshold > 0) state.expandedGroups.add(`support:${state.supportThreshold}:${nodeId}`);
    }
    function enableTreePan() {
      const viewport = $("treeViewport");
      const actionHint = $("treeActionHint");
      let active = false;
      let moved = false;
      let startX = 0;
      let startY = 0;
      let startLeft = 0;
      let startTop = 0;
      let pendingBranch = null;
      let pendingEvent = null;
      let pendingExpandNode = null;
      let pendingCollapseNode = null;
      let pendingFlipNode = null;
      let lastPointerSelection = 0;
      viewport.addEventListener("pointerdown", event => {
        if (event.button !== 0) return;
        actionHint.hidden = true;
        active = true;
        moved = false;
        pendingExpandNode = event.target.closest("[data-expand-node]")?.dataset.expandNode || null;
        pendingCollapseNode = event.target.closest("[data-collapse-node]")?.dataset.collapseNode || null;
        pendingFlipNode = event.target.closest("[data-flip-node]")?.dataset.flipNode || null;
        const hasTreeAction = pendingExpandNode || pendingCollapseNode || pendingFlipNode;
        pendingBranch = hasTreeAction ? null : (event.target.closest("[data-branch]")?.dataset.branch || null);
        pendingEvent = hasTreeAction ? null : (event.target.closest("[data-event]")?.dataset.event || null);
        startX = event.clientX;
        startY = event.clientY;
        startLeft = viewport.scrollLeft;
        startTop = viewport.scrollTop;
        viewport.setPointerCapture(event.pointerId);
        viewport.classList.add("dragging");
      });
      viewport.addEventListener("pointermove", event => {
        if (!active) return;
        const dx = event.clientX - startX;
        const dy = event.clientY - startY;
        if (Math.abs(dx) > 10 || Math.abs(dy) > 10) moved = true;
        if (!moved) return;
        viewport.scrollLeft = startLeft - dx;
        viewport.scrollTop = startTop - dy;
        event.preventDefault();
      });
      viewport.addEventListener("pointermove", event => {
        if (active && moved) { actionHint.hidden = true; return; }
        const action = event.target.closest("[data-action-hint]");
        if (!action) { actionHint.hidden = true; return; }
        const bounds = viewport.getBoundingClientRect();
        actionHint.textContent = action.dataset.actionHint;
        actionHint.style.left = `${event.clientX - bounds.left + viewport.scrollLeft + 9}px`;
        actionHint.style.top = `${event.clientY - bounds.top + viewport.scrollTop - 13}px`;
        actionHint.hidden = false;
      });
      viewport.addEventListener("pointerleave", () => { actionHint.hidden = true; });
      const finishPan = event => {
        if (!active) return;
        active = false;
        viewport.classList.remove("dragging");
        if (viewport.hasPointerCapture(event.pointerId)) viewport.releasePointerCapture(event.pointerId);
        if (!moved && pendingExpandNode) {
          lastPointerSelection = Date.now();
          expandCollapsedNode(pendingExpandNode);
          renderTree();
        } else if (!moved && pendingCollapseNode) {
          lastPointerSelection = Date.now();
          if (state.manuallyCollapsed.has(pendingCollapseNode)) state.manuallyCollapsed.delete(pendingCollapseNode);
          else state.manuallyCollapsed.add(pendingCollapseNode);
          renderTree();
        } else if (!moved && pendingFlipNode) {
          lastPointerSelection = Date.now();
          if (state.flippedNodes.has(pendingFlipNode)) state.flippedNodes.delete(pendingFlipNode);
          else state.flippedNodes.add(pendingFlipNode);
          renderTree();
        } else if (!moved && pendingBranch) {
          lastPointerSelection = Date.now();
          selectBranch(pendingBranch, pendingEvent);
        }
        pendingBranch = null;
        pendingEvent = null;
        pendingExpandNode = null;
        pendingCollapseNode = null;
        pendingFlipNode = null;
      };
      viewport.addEventListener("pointerup", finishPan);
      viewport.addEventListener("pointercancel", finishPan);
      viewport.addEventListener("click", event => {
        if (Date.now() - lastPointerSelection < 250) return;
        const expandNode = event.target.closest("[data-expand-node]")?.dataset.expandNode;
        const collapseNode = event.target.closest("[data-collapse-node]")?.dataset.collapseNode;
        const flipNode = event.target.closest("[data-flip-node]")?.dataset.flipNode;
        if (expandNode) { expandCollapsedNode(expandNode); renderTree(); return; }
        if (collapseNode) { state.manuallyCollapsed.has(collapseNode) ? state.manuallyCollapsed.delete(collapseNode) : state.manuallyCollapsed.add(collapseNode); renderTree(); return; }
        if (flipNode) { state.flippedNodes.has(flipNode) ? state.flippedNodes.delete(flipNode) : state.flippedNodes.add(flipNode); renderTree(); return; }
        const branch = event.target.closest("[data-branch]")?.dataset.branch;
        const eventKind = event.target.closest("[data-event]")?.dataset.event || null;
        if (branch) selectBranch(branch, eventKind);
      });
      viewport.addEventListener("keydown", event => {
        if (event.key !== "Enter" && event.key !== " ") return;
        const expandNode = event.target.closest("[data-expand-node]")?.dataset.expandNode;
        const collapseNode = event.target.closest("[data-collapse-node]")?.dataset.collapseNode;
        const flipNode = event.target.closest("[data-flip-node]")?.dataset.flipNode;
        if (expandNode) { event.preventDefault(); expandCollapsedNode(expandNode); renderTree(); return; }
        if (collapseNode) { event.preventDefault(); state.manuallyCollapsed.has(collapseNode) ? state.manuallyCollapsed.delete(collapseNode) : state.manuallyCollapsed.add(collapseNode); renderTree(); return; }
        if (flipNode) { event.preventDefault(); state.flippedNodes.has(flipNode) ? state.flippedNodes.delete(flipNode) : state.flippedNodes.add(flipNode); renderTree(); return; }
        const branch = event.target.closest("[data-branch]")?.dataset.branch;
        const eventKind = event.target.closest("[data-event]")?.dataset.event || null;
        if (branch) { event.preventDefault(); selectBranch(branch, eventKind); }
      });
    }
    enableTreePan();
    enableTreeZoom();
    enableTreeLayoutControls();
    enableDetailResize();
    const themes = new Set(["white", "black", "brown", "green", "blue"]);
    function applyTheme(theme) {
      const selected = themes.has(theme) ? theme : "white";
      document.documentElement.dataset.theme = selected;
      document.querySelectorAll("[data-theme-value]").forEach(button => {
        const active = button.dataset.themeValue === selected;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      });
      localStorage.setItem("species-map-theme", selected);
    }
    document.querySelectorAll("[data-theme-value]").forEach(button => button.addEventListener("click", () => applyTheme(button.dataset.themeValue)));
    applyTheme(localStorage.getItem("species-map-theme") || "white");
    start();
  </script>
</body>
